# Configuracion de despliegue en Render.
# https://render.com/docs/blueprint-spec
#
# El servidor es http.server de la biblioteca estandar, pero para CONSULTAR los
# tres motores y medir el respaldo hacen falta sus drivers: pymongo, redis y
# neo4j. estan en requirements.txt y el build los instala. Sin ellos el servicio
# arranca, pero /api/motores responde "no hay conector para este motor".
#
# Para desplegar: en render.com, "New" > "Blueprint", apuntar a este repositorio.
# Render lee este archivo y crea el servicio automaticamente.

services:
  - type: web
    name: dataforge-backup-si783
    runtime: python
    plan: free
    region: oregon
    # Instala los drivers de los tres motores. Sin este paso el despliegue
    # arranca pero la interfaz muestra los motores sin conexion.
    buildCommand: pip install -r requirements.txt
    # El puerto lo asigna Render y lo pasa en $PORT. --host 0.0.0.0 es
    # obligatorio: si se deja en 127.0.0.1 el servicio no es alcanzable desde
    # fuera y Render marca el despliegue como fallido.
    startCommand: python3 app.py --host 0.0.0.0 --puerto $PORT --sin-navegador
    # Health check en /api/salud: responde 200 con el numero de motores que
    # contestan, asi que un despliegue caido se detecta antes de presentarlo.
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"