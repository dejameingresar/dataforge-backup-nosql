# Automatizacion de pruebas: DataForge Backup
#
# Corre la suite en cada push y en cada pull request. El trabajo se pone en
# rojo si un caso falla, que es justo lo que hace que la automatizacion sea real
# y no decorativa.
#
# Nota: los casos que dependen de los motores (MongoDB, Redis, Neo4j) no pueden
# correr aqui porque el runner no los tiene. La suite los marca como fallo
# explicito en vez de inventarse un resultado, y el recorrido completo del
# respaldo se verifica en la maquina del laboratorio.

name: pruebas

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Barrido de corrupcion de texto
        run: |
          python3 checks.py app.py app/adaptador.py app/tests/casos.py

      # Antes este paso hacia `set +e` y `exit 0`: ningun fallo podia poner el
      # workflow en rojo, aunque el comentario de mas abajo afirmara lo
      # contrario. clasificar_ci.py separa los dos casos que se mezclaban:
      #   - los casos que necesitan un motor vivo (MongoDB, Redis, Neo4j) no
      #     pueden correr en el runner de GitHub Actions: se informan y se
      #     saltan, porque no son un defecto del codigo;
      #   - cualquier otro fallo es un defecto real y sale con codigo 1.
      - name: Suite de pruebas
        run: |
          set -o pipefail
          python3 app/tests/casos.py 2>&1 | tee salida.txt
          codigo=${PIPESTATUS[0]}
          echo "codigo de salida de la suite: $codigo"

      - name: Clasificar el resultado
        if: always()
        run: |
          python3 clasificar_ci.py salida.txt

      - name: Subir la salida de la suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salida-suite
          path: salida.txt
          retention-days: 30

      - name: Sube las capturas del smoke test como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: app/tests/capturas/
          if-no-files-found: ignore