# Automatizacion de pruebas: DataForge Backup
#
# Corre la suite en cada push y en cada pull request. El trabajo se pone en
# rojo si un caso falla, que es justo lo que hace que la automatizacion sea real
# y no decorativa.
#
# Nota: los casos que dependen de los motores (MongoDB, Redis, Neo4j) no pueden
# correr aqui porque el runner no los tiene. La suite los marca como fallo
# explicito en vez de inventarse un resultado, y el recorrido completo del
# respaldo se verifica en la maquina del laboratorio.

name: pruebas

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Barrido de corrupcion de texto
        run: |
          python3 checks.py app.py app/adaptador.py app/tests/casos.py

      # Antes este paso hacia `set +e` y `exit 0`: la suite no podia poner el
      # workflow en rojo jamás, aunque el comentario de arriba afirmara lo
      # contrario. Ahora se separa lo que depende de un motor (el runner de
      # GitHub Actions no tiene MongoDB, Redis ni Neo4j) de lo que es un fallo
      # real de codigo. Los casos sin motor se informan y se saltan; cualquier
      # otro fallo pone el job en rojo.
      - name: Suite de pruebas (casos que no requieren motores)
        run: |
          set -o pipefail
          python3 app/tests/casos.py 2>&1 | tee salida.txt
          echo "codigo de salida: ${PIPESTATUS[0]}"

      - name: Clasificar el resultado
        run: |
          set -o pipefail
          # La suite marca los casos que dependen de motores con un motivo
          # explicito. Se cuentan para distinguirlos de un fallo vero.
          SIN_MOTOR=$(grep -cE "motor (no )?(levantado|apagado|ausente|no disponible)|conector ausente|no hay motor" salida.txt || true)
          FALLOS=$(grep -cE "^(FALLA|FAIL)" salida.txt || true)
          echo "casos omitidos por motor ausente: $SIN_MOTOR"
          echo "fallos de codigo: $FALLOS"
          if [ "$FALLOS" -gt 0 ]; then
            echo "::error::La suite tiene $FALLOS fallos que no dependen de los motores"
            grep -E "^(FALLA|FAIL)" salida.txt | head -20
            exit 1
          fi
          echo "::warning::Los casos que requieren motores no pueden correr en el runner; se verifican contra los motores locales."

      - name: Subir la salida de la suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salida-suite
          path: salida.txt
          retention-days: 30

      - name: Sube las capturas del smoke test como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: app/tests/capturas/
          if-no-files-found: ignore